<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dabba - Delivery partner app</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{font-family:'DM Sans',sans-serif;color:#1E1233}
.h{font-family:'Bricolage Grotesque',sans-serif}
button{font-family:inherit;cursor:pointer}
.pill{background:#fff;border-radius:999px;padding:0 16px;height:44px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(30,18,51,.18)}
.kpi{flex:1;background:#F6F3FB;border-radius:16px;padding:12px 14px}
.kpi b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800}
.kpi span{font-size:12px;color:#6A5F7E}
.step{display:flex;gap:14px;align-items:flex-start}
.dot{width:16px;height:16px;border-radius:50%;box-sizing:border-box;flex:none;margin-top:3px}
.map3d{perspective:700px;overflow:hidden;height:340px;background:#E8E2F4}
.plane{transform-origin:50% 100%;transform:rotateX(40deg) scale(1.5) translateY(-6px);animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{to{transform:rotateX(48deg) scale(1.5) translateY(2px)}}
.route{stroke-dasharray:640;stroke-dashoffset:640;animation:draw 2.4s .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
.sheet{animation:up .9s .2s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes up{from{transform:translateY(140px);opacity:0}}
.nudge{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(18px)}}
.shimmer{background:linear-gradient(90deg,#A99FC4 0,#fff 50%,#A99FC4 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.kpi{transition:transform .3s}.kpi:hover{transform:translateY(-4px)}
.pill{animation:up .7s .6s backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.route{stroke-dashoffset:0}}
body{margin:0;display:flex;justify-content:center;background:#E2DBF0}</style>
</head>
<body>
<div class="app" style="width:390px;height:844px;box-sizing:border-box;background:#E8E2F4;display:flex;flex-direction:column;overflow:hidden">
<div style="position:relative;height:340px;flex:none"><div class="map3d"><div class="plane">
<svg width="390" height="340" viewBox="0 0 390 340" role="img" aria-label="Route from restaurant to customer, 3.2 km" style="display:block">
<rect width="390" height="340" fill="#E8E2F4"/>
<rect x="250" y="40" width="110" height="90" rx="14" fill="#C7E6CF"/>
<rect x="20" y="190" width="90" height="80" rx="14" fill="#C7E6CF"/>
<g stroke="#fff" stroke-width="14" stroke-linecap="round" fill="none"><path d="M-10 110H400"/><path d="M-10 240H400"/><path d="M90 -10V350"/><path d="M230 -10V350"/><path d="M340 -10V350"/></g>
<path class="route" d="M90 240V110H230V240H340" stroke="#D8391F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle class="pulse" cx="90" cy="240" r="14" fill="#FFC233"/><circle cx="90" cy="240" r="14" fill="#FFC233" stroke="#1E1233" stroke-width="3"/>
<rect x="326" y="226" width="28" height="28" rx="8" fill="#1E1233"/>
<circle cx="230" cy="110" r="9" fill="#fff" stroke="#D8391F" stroke-width="4"/>
<circle r="8" fill="#1E1233" stroke="#fff" stroke-width="3"><animateMotion dur="6s" repeatCount="indefinite" path="M90 240V110H230V240H340"/></circle></svg></div></div>
<div style="position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between">
<div class="pill"><span style="width:10px;height:10px;border-radius:50%;background:#176B3A"></span>You're online</div>
<div class="pill">₹1,240 today</div>
</div>
</div>
<div class="sheet" style="flex:1;margin-top:-28px;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px 18px;display:flex;flex-direction:column;gap:14px;position:relative">
<div style="width:40px;height:4px;border-radius:2px;background:#D5CCE6;align-self:center"></div>
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div><h1 class="h" style="margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em">New delivery</h1><div style="font-size:14px;color:#6A5F7E;margin-top:2px">Order #2841, 2 items</div></div>
<span style="background:#FFEDBF;color:#7A4300;border-radius:12px;padding:6px 12px;font-weight:800;font-size:18px">₹68</span>
</div>
<div style="display:flex;gap:10px">
<div class="kpi"><b>3.2 km</b><span>Total distance</span></div>
<div class="kpi"><b>14 min</b><span>Est. time</span></div>
<div class="kpi"><b>6 min</b><span>To pickup</span></div>
</div>
<div style="position:relative;display:flex;flex-direction:column;gap:18px">
<div style="position:absolute;left:7px;top:14px;bottom:30px;width:2px;background:#D5CCE6"></div>
<div class="step"><span class="dot" style="background:#FFC233;border:3px solid #1E1233"></span><div style="flex:1"><div style="font-weight:700;font-size:16px">Ember &amp; Rice</div><div style="font-size:13px;color:#6A5F7E">Pickup, 4th Block Market</div></div><button aria-label="Call restaurant" style="width:44px;height:44px;border-radius:50%;border:1px solid #D5CCE6;background:#fff;display:flex;align-items:center;justify-content:center;color:#1E1233"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 17v3a2 2 0 01-2 2A18 18 0 012 4a2 2 0 012-2h3l2 5-2 1a12 12 0 006 6l1-2z"/></svg></button></div>
<div class="step"><span class="dot" style="background:#1E1233"></span><div style="flex:1"><div style="font-weight:700;font-size:16px">Lakeview Apartments</div><div style="font-size:13px;color:#6A5F7E">Drop, Flat 204, Tower B</div></div><button aria-label="Call customer" style="width:44px;height:44px;border-radius:50%;border:1px solid #D5CCE6;background:#fff;display:flex;align-items:center;justify-content:center;color:#1E1233"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 17v3a2 2 0 01-2 2A18 18 0 012 4a2 2 0 012-2h3l2 5-2 1a12 12 0 006 6l1-2z"/></svg></button></div>
</div>
<div style="flex:1"></div>
<div style="position:relative;height:64px;border-radius:32px;background:#1E1233;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;padding-left:40px"><span class="shimmer">Slide to confirm pickup</span>
<button class="nudge" aria-label="Confirm pickup" style="position:absolute;left:6px;top:6px;width:52px;height:52px;border-radius:50%;border:0;background:#FFC233;color:#1E1233;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
<div style="display:flex;justify-content:center;gap:18px;font-size:13px;color:#6A5F7E"><span>14 trips today</span><span>5.2 hrs online</span></div>
</div>
</div>
</body>
</html>
